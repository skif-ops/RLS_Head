name: Sensor Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  c-golden:
    name: CMake / CTest HIL + SYS-ERR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run C golden tests
        run: ctest --test-dir build --output-on-failure

  python-wire:
    name: Python wire-format tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Run Python tests
        run: python -m pytest -q tests/python

      - name: Run HIL-R2 bench CLI smoke
        run: |
          python -m tools.hil_host.r2_evidence             tests/fixtures/hil_r2_bench_pass.csv             --config config/hil_r2_evidence_evt.json             --output hil_r2_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("hil_r2_evidence.json").read_text())
          assert data["schema"] == "HIL-R2-BENCH-EVIDENCE-001"
          assert data["gate_status"] == "PASS"
          assert data["radar_imu"]["count"] == 100
          assert data["pps"]["count"] == 30
          print("HIL-R2 CLI smoke PASS")
          PY

      - name: Run reference-range ingest smoke
        run: |
          python -m tools.reference_range             tests/fixtures/reference_range_r4.csv             --output reference_range_result.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("reference_range_result.json").read_text())
          assert data["schema"] == "REFERENCE-RANGE-RESULT-001"
          assert data["status"] == "DATA_READY"
          assert len(data["points"]) == 6
          assert math.isclose(data["fit"]["n_hat"], 4.0, abs_tol=1e-9)
          assert data["fit"]["rms_residual_db"] < 1e-9
          print("Reference-range ingest smoke PASS")
          PY

      - name: Run RAD-LB-006 Rev.A smoke
        run: |
          python -m tools.range_analysis tests/fixtures/m300_track_pass.csv --output m300_report.json
          python -m tools.rad_lb006 --reference reference_range_result.json --m300 m300_report.json --output rad_lb_006_reva.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("rad_lb_006_reva.json").read_text())
          assert data["schema"] == "RAD-LB-006-REVA"
          assert data["status"] == "PROJECTED"
          assert len(data["cells"]) == 12
          assert math.isclose(data["range_model"]["n_hat"], 4.0, abs_tol=1e-9)

          cell = next(
              c for c in data["cells"]
              if c["range_m"] == 600.0 and c["rcs_m2"] == 0.10
          )
          assert math.isclose(
              cell["m_total_r4_db"],
              -0.041199826559248,
              abs_tol=1e-6,
          )
          print("RAD-LB-006 Rev.A smoke PASS")
          PY

      - name: Run RAD-LB-006 Rev.B antenna smoke
        run: |
          python -m tools.rad_lb006_revb             --reva rad_lb_006_reva.json             --antenna tests/fixtures/d1_antenna_map_nominal.csv             --case-id NOMINAL             --frequency-hz 78500000000             --output rad_lb_006_revb.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("rad_lb_006_revb.json").read_text())
          assert data["schema"] == "RAD-LB-006-REVB"
          assert data["status"] == "PROJECTED"
          assert data["antenna_selection"]["map_points"] == 3

          cell = next(
              c for c in data["cells"]
              if c["range_m"] == 600.0
              and c["rcs_m2"] == 0.10
              and c["az_deg"] == 0.0
          )
          assert math.isclose(cell["m_ant_db"], 2.0, abs_tol=1e-12)
          assert cell["projected_track_r4"] is True

          ambiguous = next(
              c for c in data["cells"]
              if c["range_m"] == 300.0
              and c["rcs_m2"] == 0.01
              and c["az_deg"] == 45.0
          )
          assert ambiguous["ambiguity_flag"] is True
          assert ambiguous["projected_track_r4"] is False

          print("RAD-LB-006 Rev.B antenna smoke PASS")
          PY

      - name: Validate D1 antenna-map evidence
        run: |
          python -m tools.antenna_map_validate             tests/fixtures/d1_antenna_map_3freq.csv             --config config/d1_map_validation_evt.json             --output antenna_map_validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("antenna_map_validation.json").read_text())
          assert data["schema"] == "ANT-D1-MAP-VALIDATION-001"
          assert data["status"] == "DATA_READY"
          assert data["row_count"] == 9
          assert len(data["groups"]) == 3
          print("D1 antenna-map validation smoke PASS")
          PY

      - name: Validate D1 EM solver provenance
        run: |
          python -m tools.ant_em_evidence \
            --manifest tests/fixtures/d1_em/manifest.json \
            --map-config config/d1_map_validation_evt.json \
            --repository-root . \
            --output d1_em_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("d1_em_evidence.json").read_text())
          assert data["schema"] == "ANT-D1-EM-EVIDENCE-001"
          assert data["status"] == "TEST_READY"
          assert data["synthetic_fixture"] is True
          assert data["map_validation"]["status"] == "DATA_READY"
          assert all(v["hash_ok"] for v in data["verified_artifacts"].values())
          print("D1 EM provenance smoke PASS")
          PY

      - name: Run D1 Monte-Carlo summary smoke
        run: |
          python -m tools.antenna_mc_summary             tests/fixtures/d1_mc_pass.csv             --output d1_mc_summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("d1_mc_summary.json").read_text())
          assert data["schema"] == "ANT-D1-MC-SUMMARY-001"
          assert data["status"] == "PASS"
          mandatory = next(
              c for c in data["cells"]
              if c["mandatory_region"]
          )
          assert mandatory["sample_count"] == 20
          assert mandatory["robust"] is True
          print("D1 Monte-Carlo summary smoke PASS")
          PY

      - name: Evaluate ANT-SIM-GATE
        run: |
          python -m tools.ant_sim_gate             --validation antenna_map_validation.json             --mc d1_mc_summary.json             --revb rad_lb_006_revb.json             --output ant_sim_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("ant_sim_gate.json").read_text())
          assert data["schema"] == "ANT-SIM-GATE-001"
          assert data["status"] == "PASS"
          assert data["mandatory_300m"]["projected_track_point_count"] >= 1
          assert data["mandatory_300m"]["projected_high_acc_point_count"] >= 1
          print("ANT-SIM-GATE smoke PASS")
          PY

      - name: Evaluate HW-SENSOR-PROTOTYPE-GATE logic
        run: |
          python -m tools.hw_sensor_prototype_gate             --m300 tests/fixtures/m300_measured_gate_pass.json             --ant-sim ant_sim_gate.json             --sys-err tests/fixtures/sys_err_gate_pass.json             --output hw_sensor_prototype_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("hw_sensor_prototype_gate.json").read_text())
          assert data["schema"] == "HW-SENSOR-PROTOTYPE-GATE-001"
          assert data["status"] == "PASS"
          assert data["prototype_authorization"] == "AUTHORIZED_FOR_MEASUREMENT"
          assert "integrated radar PCB production" in data["explicitly_not_authorized"]
          print("HW-SENSOR-PROTOTYPE-GATE logic smoke PASS")
          PY

      - name: Validate physical antenna measurement tooling
        run: |
          python -m tools.physical_antenna_measurement \
            --manifest tests/fixtures/physical_antenna_measurement_manifest_ci.json \
            --config config/physical_antenna_measurement_evt.json \
            --repository-root . \
            --output physical_antenna_measurement_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("physical_antenna_measurement_result.json").read_text())
          assert data["schema"] == "ANT-MEASUREMENT-001"
          assert data["status"] == "TEST_READY"
          assert data["measurement_status"] == "PASS"
          assert data["synthetic_fixture"] is True
          assert data["track_usable_point_count"] >= 1
          assert data["high_acc_usable_point_count"] >= 1
          print("Physical antenna measurement tooling smoke PASS")
          PY

      - name: Evaluate AWR EVM profile gate
        run: |
          python -m tools.evm_profile_gate \
            --metrics tests/fixtures/evm_profile_metrics_ci.csv \
            --manifest tests/fixtures/evm_profiles/TRACK.json \
            --manifest tests/fixtures/evm_profiles/LR1.json \
            --manifest tests/fixtures/evm_profiles/LR2.json \
            --manifest tests/fixtures/evm_profiles/LRX.json \
            --config config/evm_profile_gate_evt.json \
            --output evm_profile_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("evm_profile_result.json").read_text())
          assert data["schema"] == "EVM-PROFILE-RESULT-001"
          assert data["status"] == "TEST_READY"
          assert data["profiles"]["TRACK"]["status"] == "OPERATIONAL"
          assert data["profiles"]["LR1"]["status"] == "OPERATIONAL"
          assert data["profiles"]["LR2"]["status"] == "CONDITIONAL"
          assert data["profiles"]["LRX"]["status"] == "RESEARCH_ONLY"
          print("AWR EVM profile gate smoke PASS")
          PY

      - name: Validate System Carrier design inputs
        run: |
          python -m tools.carrier_design_inputs \
            hardware/system_carrier \
            --output carrier_design_inputs.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("carrier_design_inputs.json").read_text())
          assert data["schema"] == "CARRIER-DESIGN-INPUTS-001"
          assert data["status"] == "DESIGN_INPUT_READY"
          assert data["failed_components"] == []
          assert data["bom"]["status"] == "PASS"
          assert data["pinmap"]["status"] == "PASS"
          assert data["clock_tree"]["status"] == "PASS"
          assert data["power_tree"]["status"] == "PASS"
          assert data["netlist"]["status"] == "PASS"
          print("System Carrier design-input smoke PASS")
          PY

      - name: Validate System Carrier hierarchy contract
        run: |
          python -m tools.carrier_hierarchy_contract \
            hardware/system_carrier/HIERARCHY_INTERFACE_SYS_001.csv \
            --output carrier_hierarchy_contract.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("carrier_hierarchy_contract.json").read_text()
          )
          assert data["schema"] == "SYSTEM-CARRIER-HIERARCHY-CONTRACT-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          assert data["sheet_count"] == 7
          print("System Carrier hierarchy contract PASS")
          PY

      - name: Validate Altium primary CAD policy
        run: |
          python -m tools.altium_cad_policy \
            hardware/system_carrier \
            --output altium_cad_policy.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("altium_cad_policy.json").read_text())
          assert data["schema"] == "ALTIUM-CAD-POLICY-RESULT-001"
          assert data["status"] == "PASS"
          assert data["primary_cad"] == "Altium Designer"
          assert data["preserve_kicad"] is True
          assert data["source_rule_count"] == data["mapped_rule_count"] == 24
          assert data["layer_count"] == 4
          assert data["outjob_contract_count"] == 14
          assert data["required_output_count"] == 13
          assert data["release_checklist_count"] == 18
          assert data["board_planning_count"] == 8
          assert data["dfm_profile_count"] == 10
          assert data["implementation_step_count"] == 14
          assert data["impedance_model_count"] == 2
          assert data["power_width_model_count"] == 4
          assert data["diff_pair_count"] == 3
          assert data["rule_query_count"] == 10
          assert data["room_count"] == 7
          assert data["equivalence_check_count"] == 11
          native_sch = Path(
              "hardware/system_carrier/altium/native/EVT_SYS_CARRIER.SchDoc"
          ).is_file()
          native_pcb = Path(
              "hardware/system_carrier/altium/native/EVT_SYS_CARRIER.PcbDoc"
          ).is_file()
          assert native_sch == native_pcb
          expected_phase = (
              "READY_FOR_ROUTING"
              if native_sch
              else "IMPORT_PREPARED"
          )
          assert data["altium_phase"] == expected_phase
          print("Altium primary CAD policy PASS:", expected_phase)
          PY

      - name: Validate Altium placement geometry
        run: |
          python -m tools.altium_placement_gate \
            hardware/system_carrier \
            --output altium_placement_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("altium_placement_gate.json").read_text())
          assert data["schema"] == "ALTIUM-PLACEMENT-GATE-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          assert data["edge_ref_count"] >= 6
          assert data["hard_position_count"] >= 20
          assert data["imu_to_buck_mm"] >= 20.0
          assert data["eth_50m_to_mcu_mm"] <= 20.0
          assert data["eth_50m_to_phy_mm"] <= 20.0
          print("Altium placement geometry PASS")
          PY

      - name: Validate Altium provisional impedance model
        run: |
          python -m tools.altium_impedance_gate \
            hardware/system_carrier \
            --output altium_impedance_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("altium_impedance_gate.json").read_text())
          assert data["schema"] == "ALTIUM-IMPEDANCE-GATE-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          assert data["stack_total_mm"] == 1.6
          assert len(data["models"]) == 2
          assert data["production_binding_required"] is True
          print("Altium provisional impedance model PASS")
          PY

      - name: Validate Altium provisional power widths
        run: |
          python -m tools.altium_power_width_gate \
            hardware/system_carrier \
            --output altium_power_width_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("altium_power_width_gate.json").read_text())
          assert data["schema"] == "ALTIUM-POWER-WIDTH-GATE-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          assert len(data["models"]) == 4
          assert data["production_review_required"] is True
          print("Altium provisional power-width model PASS")
          PY

      - name: Validate Altium rule scopes and differential pairs
        run: |
          python -m tools.altium_rule_scope_gate \
            hardware/system_carrier \
            --output altium_rule_scope_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("altium_rule_scope_gate.json").read_text())
          assert data["schema"] == "ALTIUM-RULE-SCOPE-GATE-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          assert data["rule_count"] == 10
          assert data["differential_pair_count"] == 3
          assert data["differential_pair_class_count"] == 2
          print("Altium rule scopes and differential pairs PASS")
          PY

      - name: Validate Altium provisional placement rooms
        run: |
          python -m tools.altium_room_gate \
            hardware/system_carrier \
            --output altium_room_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("altium_room_gate.json").read_text())
          assert data["schema"] == "ALTIUM-ROOM-GATE-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          assert data["room_count"] == 7
          assert data["hard_checked_count"] >= 20
          print("Altium provisional placement rooms PASS")
          PY

      - name: Validate System Carrier schematic contract
        run: |
          python -m tools.carrier_schematic_contract \
            hardware/system_carrier \
            --output carrier_schematic_contract.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("carrier_schematic_contract.json").read_text())
          assert data["schema"] == "CARRIER-SCHEMATIC-CONTRACT-001"
          assert data["status"] == "SCHEMATIC_CAPTURE_READY"
          assert data["failed_sections"] == []
          print("System Carrier schematic contract PASS")
          PY

      - name: Validate System Carrier Review A tooling
        run: |
          python -m tools.carrier_review_a \
            tests/fixtures/carrier_review_a/manifest.json \
            --repository-root . \
            --output carrier_review_a_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("carrier_review_a_result.json").read_text())
          assert data["schema"] == "CARRIER-REVIEW-A-RESULT-001"
          assert data["status"] == "TEST_READY"
          assert data["synthetic_fixture"] is True
          assert data["erc"]["errors"] == 0
          assert data["erc"]["warnings"] == 0
          assert data["pinmap"]["status"] == "PASS"
          assert data["bom"]["status"] == "PASS"
          assert all(v == "PASS" for v in data["audits"].values())
          print("Carrier Review A tooling smoke PASS")
          PY

      - name: Evaluate integrated radar gate
        run: |
          python -m tools.integrated_radar_gate \
            evidence/project_evidence_manifest.json \
            --output integrated_radar_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("integrated_radar_gate.json").read_text())
          assert data["schema"] == "INTEGRATED-RADAR-GATE-001"
          assert data["status"] == "HOLD"
          assert data["prototype_authorization"] == "NOT_AUTHORIZED"
          assert "not_ready:AWR_EVM_PROFILE_MEASURED" in data["reason_codes"]
          assert "not_ready:PHYSICAL_ANT_MEASUREMENT" in data["reason_codes"]
          assert "not_ready:SYS_ERR_MEASURED" in data["reason_codes"]
          print("Integrated radar gate smoke HOLD as expected")
          PY

      - name: Evaluate measured SYS-ERR gate
        run: |
          python -m tools.sys_err_measured_gate \
            --manifest tests/fixtures/sys_err_measured_manifest_ci.json \
            --config config/sys_err_measured_evt.json \
            --repository-root . \
            --output sys_err_measured_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("sys_err_measured_gate.json").read_text())
          assert data["schema"] == "SYS-ERR-GATE-001"
          assert data["status"] == "TEST_READY"
          assert data["gate_status"] == "PASS"
          assert data["synthetic_fixture"] is True
          assert len(data["cells"]) == 3
          assert len(data["mandatory_cells"]) == 1
          assert data["mandatory_cells"][0]["range_m"] == 300.0
          assert data["mandatory_cells"][0]["position_rms_m"] < 2.10
          print("Measured SYS-ERR gate smoke PASS")
          PY

      - name: Validate project evidence status
        run: |
          python -m tools.evidence_status             evidence/project_evidence_manifest.json             --output project_evidence_status.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("project_evidence_status.json").read_text())
          assert data["schema"] == "PROJECT-EVIDENCE-STATUS-001"
          assert data["status"] == "VALID"
          assert data["milestones"]["M1"]["status"] == "OPEN"
          assert data["milestones"]["HW_SENSOR_PROTOTYPE_GATE_INPUTS"]["status"] == "OPEN"
          assert "M300_MEASURED" in data["measured_open_items"]
          assert "SYS_ERR_MEASURED" in data["measured_open_items"]
          assert "PHYSICAL_ANT_MEASUREMENT_TOOLING" in data["passed_items"]
          assert "SYS_ERR_MEASURED_TOOLING" in data["passed_items"]
          assert "ANT_D1_EM_TOOLING" in data["passed_items"]
          assert "INTEGRATED_RADAR_GATE_TOOLING" in data["passed_items"]
          assert "EVIDENCE_PROMOTION_TOOLING" in data["passed_items"]
          assert "AWR_EVM_PROFILE_TOOLING" in data["passed_items"]
          assert "CARRIER_DESIGN_INPUTS" in data["passed_items"]
          assert "CARRIER_REVIEW_A_TOOLING" in data["passed_items"]
          assert "TIME_SERVICE_LOGIC" in data["passed_items"]
          assert data["milestones"]["M1"]["status"] == "OPEN"
          print("Project evidence status smoke PASS")
          PY

      - name: Validate EVM run manifest integrity
        run: |
          python -m tools.evm_run_manifest             tests/fixtures/evm_run_manifest_ci.json             --output evm_run_validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("evm_run_validation.json").read_text())
          assert data["schema"] == "EVM-RUN-VALIDATION-001"
          assert data["status"] == "TEST_READY"
          assert data["synthetic_fixture"] is True
          assert data["evidence_level"] == "SOFTWARE_CI"
          print("EVM run integrity smoke PASS")
          PY

      - name: Assemble synthetic EVM reference campaign
        run: |
          python -m tools.evm_campaign \
            --manifest tests/fixtures/evm_campaign/R050.json \
            --manifest tests/fixtures/evm_campaign/R100.json \
            --manifest tests/fixtures/evm_campaign/R150.json \
            --manifest tests/fixtures/evm_campaign/R200.json \
            --manifest tests/fixtures/evm_campaign/R250.json \
            --manifest tests/fixtures/evm_campaign/R300.json \
            --output evm_reference_campaign.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("evm_reference_campaign.json").read_text())
          assert data["schema"] == "EVM-REFERENCE-CAMPAIGN-001"
          assert data["status"] == "TEST_READY"
          assert data["measured_ranges_m"] == []
          assert data["test_ranges_m"] == [50.0, 100.0, 150.0, 200.0, 250.0, 300.0]
          print("EVM campaign assembler smoke PASS")
          PY

      - name: Run execution coverage audit smoke
        run: |
          python -m tools.execution_coverage_audit \
            --output-root coverage_jobs \
            --output execution_coverage_audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("execution_coverage_audit.json").read_text())
          assert data["schema"] == "EXECUTION-COVERAGE-AUDIT-001"
          assert data["status"] == "PASS"
          assert data["plan_item_count"] == data["covered_item_count"]
          assert data["missing_recipes"] == []
          assert data["errors"] == []
          print("Execution coverage audit smoke PASS")
          PY

      - name: Run project execution snapshot smoke
        run: |
          python -m tools.project_execution_snapshot \
            --manifest evidence/project_evidence_manifest.json \
            --output project_execution_snapshot.json \
            --output-job-pack-dir next_external_job
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("project_execution_snapshot.json").read_text())
          assert data["schema"] == "PROJECT-EXECUTION-SNAPSHOT-001"
          assert data["status"] == "READY"
          assert data["execution_queue"]["schema"] == "EXTERNAL-EXECUTION-QUEUE-001"
          assert data["execution_recipes"]["schema"] == "EXTERNAL-EXECUTION-RECIPE-001"
          assert data["summary"]["queue_depth"] >= 1
          assert data["next_job_pack"] is not None
          assert data["next_job_pack_validation"]["status"] == "TEMPLATE_READY"
          print("Project execution snapshot smoke PASS")
          PY

      - name: Upload execution workflow status
        uses: actions/upload-artifact@v4
        with:
          name: execution-workflow-status
          path: |
            execution_coverage_audit.json
            project_execution_snapshot.json

  stm32h753-cross:
    name: STM32H753 Cortex-M7 cross-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version
          arm-none-eabi-size --version

      - name: Configure STM32H753 link-smoke
        run: |
          cmake -S . -B build-stm32             -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-gcc.cmake             -DHIL_BUILD_HOST_TESTS=OFF             -DHIL_BUILD_STM32H753_SMOKE=ON             -DCMAKE_BUILD_TYPE=Release

      - name: Build STM32H753 ELF
        run: cmake --build build-stm32 --parallel

      - name: Inspect memory and sections
        run: |
          arm-none-eabi-size build-stm32/stm32h753_link_smoke.elf
          arm-none-eabi-objdump -h build-stm32/stm32h753_link_smoke.elf | tee build-stm32/sections.txt
          arm-none-eabi-nm -C --defined-only build-stm32/stm32h753_link_smoke.elf | tee build-stm32/symbols.txt
          test -s build-stm32/stm32h753_link_smoke.map
          grep -q "hil_runtime_process_packet" build-stm32/symbols.txt
          grep -q "targetstate_v1_serialize" build-stm32/symbols.txt
          grep -q "cv_tracker_update" build-stm32/symbols.txt
          python3 tools/check_stm32_layout.py build-stm32/sections.txt

      - name: Upload STM32H753 link evidence
        uses: actions/upload-artifact@v4
        with:
          name: stm32h753-link-evidence
          path: |
            build-stm32/stm32h753_link_smoke.elf
            build-stm32/stm32h753_link_smoke.map
            build-stm32/sections.txt
            build-stm32/symbols.txt

  system-carrier-cad:
    name: System Carrier generated KiCad scaffold
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install KiCad 9 and schematic generator
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --install-recommends kicad
          python -m pip install --upgrade "kicad-sch-api==0.5.6"
          kicad-cli version

      - name: Generate System Carrier schematic scaffold
        run: |
          python -m tools.generate_system_carrier_schematic \
            --output-dir build-cad/system_carrier
          python -m tools.validate_system_carrier_cad_scaffold \
            build-cad/system_carrier \
            --output build-cad/system_carrier/cad_scaffold_validation.json

      - name: Validate local Carrier footprints with KiCad
        run: |
          cp -r \
            build-cad/system_carrier/SystemCarrier_Local.pretty \
            build-cad/system_carrier/SystemCarrier_Local.validate.pretty
          kicad-cli fp upgrade --force \
            build-cad/system_carrier/SystemCarrier_Local.validate.pretty
          rm -rf \
            build-cad/system_carrier/SystemCarrier_Local.validate.pretty

      - name: Validate generated System Carrier hierarchy
        run: |
          python -m tools.validate_system_carrier_hierarchy \
            build-cad/system_carrier/EVT_SYS_CARRIER.kicad_sch \
            --output build-cad/system_carrier/hierarchy_validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/hierarchy_validation.json"
              ).read_text()
          )
          assert data["schema"] == "SYSTEM-CARRIER-HIERARCHY-CAD-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          assert (
              data["connection_count"]
              == data["validated_connection_count"]
          )
          print(
              "System Carrier hierarchy PASS:",
              data["connection_count"],
              "connections",
          )
          PY

      - name: Validate System Carrier Review A readiness
        run: |
          python -m tools.carrier_review_a_readiness \
            --repository-root . \
            --scaffold-manifest build-cad/system_carrier/cad_scaffold_manifest.json \
            --output build-cad/system_carrier/review_a_readiness.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/review_a_readiness.json"
              ).read_text()
          )
          assert data["status"] == "READY_FOR_REVIEW_A"
          assert data["placeholder_count"] == 0
          assert data["open_external_blocker_count"] == 0
          assert data["unresolved_footprint_count"] == 0
          print("System Carrier READY_FOR_REVIEW_A")
          PY

      - name: Run real KiCad ERC
        run: |
          kicad-cli sch erc \
            --format json \
            --output build-cad/system_carrier/erc.json \
            build-cad/system_carrier/EVT_SYS_CARRIER.kicad_sch
          python -m tools.carrier_erc_triage \
            build-cad/system_carrier/erc.json \
            --output build-cad/system_carrier/erc_triage.json
          cat build-cad/system_carrier/erc_triage.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build-cad/system_carrier")
          manifest = json.loads((root / "cad_scaffold_manifest.json").read_text())
          validation = json.loads((root / "cad_scaffold_validation.json").read_text())
          erc = json.loads((root / "erc.json").read_text())

          assert manifest["schema"] == "SYSTEM-CARRIER-CAD-SCAFFOLD-001"
          assert manifest["status"] == "CAD_SCAFFOLD_READY"
          assert validation["status"] == "PASS"
          assert validation["placeholder_count"] == 0
          assert erc["source"] == "EVT_SYS_CARRIER.kicad_sch"

          violations = sum(
              len(sheet.get("violations", []))
              for sheet in erc.get("sheets", [])
          )

          assert violations == 0, f"System Carrier ERC violations: {violations}"

          summary = {
              "schema": "SYSTEM-CARRIER-CAD-CI-001",
              "status": "ERC_CLEAN",
              "kicad_version": erc.get("kicad_version"),
              "sheet_count": manifest["sheet_count"],
              "placeholder_count": validation["placeholder_count"],
              "local_symbol_count": validation["local_symbol_count"],
              "erc_violation_count": violations,
              "review_a_closed": False,
          }
          (root / "cad_ci_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Build retained KiCad netlist baseline
        run: |
          kicad-cli sch export netlist \
            --format kicadxml \
            --output build-cad/system_carrier/kicad_netlist.xml \
            build-cad/system_carrier/EVT_SYS_CARRIER.kicad_sch
          python -m tools.kicad_netlist_baseline \
            --system-root hardware/system_carrier \
            --xml-netlist build-cad/system_carrier/kicad_netlist.xml \
            --output-csv build-cad/system_carrier/kicad_netlist_baseline.csv \
            --output-result build-cad/system_carrier/kicad_netlist_baseline_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/kicad_netlist_baseline_result.json"
              ).read_text()
          )
          assert data["schema"] == "KICAD-NETLIST-BASELINE-001"
          assert data["status"] == "PASS"
          assert data["connected_endpoint_count"] > 0
          print(
              "KiCad netlist baseline PASS:",
              data["connected_endpoint_count"],
              "connected physical endpoints",
          )
          PY

      - name: Build real System Carrier Review A package
        run: |
          python -m tools.carrier_review_a_package \
            --generated-dir build-cad/system_carrier \
            --system-root hardware/system_carrier \
            --output-dir build-cad/system_carrier/review_a \
            --source-commit "${{ github.sha }}" \
            --source-run-id "${{ github.run_id }}"
          python -m tools.carrier_review_a \
            build-cad/system_carrier/review_a/manifest.json \
            --repository-root build-cad/system_carrier/review_a \
            --output build-cad/system_carrier/review_a/result.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build-cad/system_carrier")
          result = json.loads(
              (root / "review_a" / "result.json").read_text()
          )
          assert result["schema"] == "CARRIER-REVIEW-A-RESULT-001"
          assert result["status"] == "PASS"
          assert result["synthetic_fixture"] is False
          assert result["evidence_level"] == "CAD_REVIEW"
          assert result["erc"]["errors"] == 0
          assert result["erc"]["warnings"] == 0
          assert result["pinmap"]["status"] == "PASS"
          assert result["bom"]["status"] == "PASS"
          assert all(
              value == "PASS"
              for value in result["audits"].values()
          )

          summary_path = root / "cad_ci_summary.json"
          summary = json.loads(summary_path.read_text())
          summary["status"] = "REVIEW_A_PASS"
          summary["review_a_closed"] = True
          summary["review_a_result"] = "PASS"
          summary_path.write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )

          print("CARRIER_REVIEW_A PASS")
          PY

      - name: Upload System Carrier Review A package
        uses: actions/upload-artifact@v4
        with:
          name: system-carrier-review-a
          path: build-cad/system_carrier/review_a/**

      - name: Validate System Carrier Altium pre-layout
        run: |
          python -m tools.carrier_prelayout_validate \
            --system-root hardware/system_carrier \
            --generated-dir build-cad/system_carrier \
            --output build-cad/system_carrier/prelayout_validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/prelayout_validation.json"
              ).read_text()
          )
          assert data["schema"] == "SYSTEM-CARRIER-PRELAYOUT-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          assert data["mcu_vdd_decoupling_count"] == 14
          assert data["board_width_mm"] == 100.0
          assert data["board_height_mm"] == 80.0
          assert (
              data["physical_ref_count"]
              == data["bom_ref_count"]
              == data["footprint_ref_count"]
          )
          print(
              "System Carrier Altium pre-layout PASS:",
              data["physical_ref_count"],
              "physical refs",
          )
          PY

      - name: Validate Altium placement geometry for import
        run: |
          python -m tools.altium_placement_gate \
            hardware/system_carrier \
            --output build-cad/system_carrier/altium_placement_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/altium_placement_gate.json"
              ).read_text()
          )
          assert data["schema"] == "ALTIUM-PLACEMENT-GATE-001"
          assert data["status"] == "PASS"
          assert data["errors"] == []
          print("Altium placement geometry evidence READY")
          PY

      - name: Validate Altium impedance model for import
        run: |
          python -m tools.altium_impedance_gate \
            hardware/system_carrier \
            --output build-cad/system_carrier/altium_impedance_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/altium_impedance_gate.json"
              ).read_text()
          )
          assert data["status"] == "PASS"
          assert data["production_binding_required"] is True
          print("Altium impedance evidence READY")
          PY

      - name: Validate Altium power widths for import
        run: |
          python -m tools.altium_power_width_gate \
            hardware/system_carrier \
            --output build-cad/system_carrier/altium_power_width_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/altium_power_width_gate.json"
              ).read_text()
          )
          assert data["status"] == "PASS"
          assert data["production_review_required"] is True
          print("Altium power-width evidence READY")
          PY

      - name: Validate Altium rule scopes for import
        run: |
          python -m tools.altium_rule_scope_gate \
            hardware/system_carrier \
            --output build-cad/system_carrier/altium_rule_scope_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/altium_rule_scope_gate.json"
              ).read_text()
          )
          assert data["status"] == "PASS"
          assert data["rule_count"] == 10
          print("Altium native rule-scope evidence READY")
          PY

      - name: Validate Altium rooms for import
        run: |
          python -m tools.altium_room_gate \
            hardware/system_carrier \
            --output build-cad/system_carrier/altium_room_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/altium_room_gate.json"
              ).read_text()
          )
          assert data["status"] == "PASS"
          assert data["room_count"] == 7
          print("Altium room evidence READY")
          PY

      - name: Evaluate Altium routing readiness
        run: |
          python -m tools.altium_routing_readiness \
            --system-root hardware/system_carrier \
            --generated-dir build-cad/system_carrier \
            --output build-cad/system_carrier/altium_routing_readiness.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/altium_routing_readiness.json"
              ).read_text()
          )
          assert data["schema"] == "ALTIUM-ROUTING-READINESS-001"
          native_sch = Path(
              "hardware/system_carrier/altium/native/EVT_SYS_CARRIER.SchDoc"
          ).is_file()
          native_pcb = Path(
              "hardware/system_carrier/altium/native/EVT_SYS_CARRIER.PcbDoc"
          ).is_file()
          assert native_sch == native_pcb
          assert data["production_authorized"] is False
          assert data["errors"] == []
          assert data["failed_checks"] == []
          if native_sch:
              assert data["status"] == "READY_FOR_ROUTING"
              assert data["routing_authorized"] is True
              assert (
                  data["next_action"]
                  == "BEGIN_NATIVE_ALTIUM_PLACEMENT_AND_ROUTING"
              )
          else:
              assert data["status"] == "READY_FOR_NATIVE_IMPORT"
              assert data["routing_authorized"] is False
              assert (
                  data["next_action"]
                  == "RUN_NATIVE_ALTIUM_IMPORT_AND_EQUIVALENCE"
              )
          print("Altium routing readiness:", data["status"])
          PY

      - name: Evaluate native Altium handoff status
        run: |
          python -m tools.altium_native_handoff_status \
            --repository-root . \
            --output build-cad/system_carrier/altium_native_handoff_status.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/altium_native_handoff_status.json"
              ).read_text()
          )
          assert data["schema"] == "ALTIUM-NATIVE-HANDOFF-STATUS-001"
          native_sch = Path(
              "hardware/system_carrier/altium/native/EVT_SYS_CARRIER.SchDoc"
          ).is_file()
          native_pcb = Path(
              "hardware/system_carrier/altium/native/EVT_SYS_CARRIER.PcbDoc"
          ).is_file()
          assert native_sch == native_pcb
          expected_status = (
              "READY_TO_RUN_EQUIVALENCE_GATE"
              if native_sch
              else "WAITING_NATIVE_IMPORT"
          )
          assert data["status"] == expected_status
          assert data["routing_authorized"] is False
          assert data["production_authorized"] is False
          print("Native Altium handoff status:", data["status"])
          PY

      - name: Evaluate two-phase native Altium CI gate
        run: |
          python -m tools.altium_native_ci_gate \
            --repository-root . \
            --generated-dir build-cad/system_carrier \
            --output build-cad/system_carrier/altium_native_ci_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(
                  "build-cad/system_carrier/altium_native_ci_gate.json"
              ).read_text()
          )
          assert data["schema"] == "ALTIUM-NATIVE-CI-GATE-001"
          assert data["status"] == "PASS"
          assert data["phase"] in {"PRE_IMPORT", "POST_EQUIVALENCE"}
          assert data["production_authorized"] is False
          if data["phase"] == "PRE_IMPORT":
              assert data["routing_authorized"] is False
          else:
              assert data["routing_authorized"] is True
              assert data["equivalence_status"] == "PASS"
          print(
              "Native Altium CI phase gate PASS:",
              data["phase"],
          )
          PY

      - name: Build Altium import package
        run: |
          python -m tools.altium_import_package \
            --generated-dir build-cad/system_carrier \
            --system-root hardware/system_carrier \
            --output-dir build-cad/altium_import \
            --source-commit "${{ github.sha }}"
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("build-cad/altium_import/manifest.json").read_text()
          )
          assert data["schema"] == "ALTIUM-IMPORT-PACKAGE-001"
          assert data["status"] == "READY_FOR_ALTIUM_IMPORT"
          assert data["target_cad"] == "Altium Designer"
          assert data["preserve_kicad"] is True
          assert data["production_contracts_included"] is True
          assert data["placement_gate_included"] is True
          assert data["impedance_gate_included"] is True
          assert data["power_width_gate_included"] is True
          assert data["rule_scope_gate_included"] is True
          assert data["room_gate_included"] is True
          assert data["routing_readiness_included"] is True
          assert data["native_audit_script_included"] is True
          assert data["native_handoff_runbook_included"] is True
          assert data["equivalence_manifest_template_included"] is True
          assert data["kicad_netlist_baseline_included"] is True
          assert data["file_count"] >= 45
          print(
              "Altium import package READY:",
              data["file_count"],
              "files",
          )
          PY

      - name: Upload Altium import package
        uses: actions/upload-artifact@v4
        with:
          name: system-carrier-altium-import
          path: build-cad/altium_import/**

      - name: Upload generated System Carrier CAD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-carrier-cad-scaffold
          path: |
            build-cad/system_carrier/*.kicad_sch
            build-cad/system_carrier/*.kicad_pro
            build-cad/system_carrier/*.kicad_sym
            build-cad/system_carrier/*.json
            build-cad/system_carrier/fp-lib-table
            build-cad/system_carrier/sym-lib-table
            build-cad/system_carrier/SystemCarrier_Local.pretty/*.kicad_mod

