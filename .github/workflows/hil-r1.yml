name: Sensor Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  c-golden:
    name: CMake / CTest HIL + SYS-ERR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run C golden tests
        run: ctest --test-dir build --output-on-failure

  python-wire:
    name: Python wire-format tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Run Python tests
        run: python -m pytest -q tests/python

      - name: Run HIL-R2 bench CLI smoke
        run: |
          python -m tools.hil_host.r2_evidence             tests/fixtures/hil_r2_bench_pass.csv             --config config/hil_r2_evidence_evt.json             --output hil_r2_evidence.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("hil_r2_evidence.json").read_text())
          assert data["schema"] == "HIL-R2-BENCH-EVIDENCE-001"
          assert data["gate_status"] == "PASS"
          assert data["radar_imu"]["count"] == 100
          assert data["pps"]["count"] == 30
          print("HIL-R2 CLI smoke PASS")
          PY

      - name: Run reference-range ingest smoke
        run: |
          python -m tools.reference_range             tests/fixtures/reference_range_r4.csv             --output reference_range_result.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("reference_range_result.json").read_text())
          assert data["schema"] == "REFERENCE-RANGE-RESULT-001"
          assert data["status"] == "DATA_READY"
          assert len(data["points"]) == 6
          assert math.isclose(data["fit"]["n_hat"], 4.0, abs_tol=1e-9)
          assert data["fit"]["rms_residual_db"] < 1e-9
          print("Reference-range ingest smoke PASS")
          PY

      - name: Run RAD-LB-006 Rev.A smoke
        run: |
          python -m tools.range_analysis tests/fixtures/m300_track_pass.csv --output m300_report.json
          python -m tools.rad_lb006 --reference reference_range_result.json --m300 m300_report.json --output rad_lb_006_reva.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("rad_lb_006_reva.json").read_text())
          assert data["schema"] == "RAD-LB-006-REVA"
          assert data["status"] == "PROJECTED"
          assert len(data["cells"]) == 12
          assert math.isclose(data["range_model"]["n_hat"], 4.0, abs_tol=1e-9)

          cell = next(
              c for c in data["cells"]
              if c["range_m"] == 600.0 and c["rcs_m2"] == 0.10
          )
          assert math.isclose(
              cell["m_total_r4_db"],
              -0.041199826559248,
              abs_tol=1e-6,
          )
          print("RAD-LB-006 Rev.A smoke PASS")
          PY

      - name: Run RAD-LB-006 Rev.B antenna smoke
        run: |
          python -m tools.rad_lb006_revb             --reva rad_lb_006_reva.json             --antenna tests/fixtures/d1_antenna_map_nominal.csv             --case-id NOMINAL             --frequency-hz 78500000000             --output rad_lb_006_revb.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("rad_lb_006_revb.json").read_text())
          assert data["schema"] == "RAD-LB-006-REVB"
          assert data["status"] == "PROJECTED"
          assert data["antenna_selection"]["map_points"] == 3

          cell = next(
              c for c in data["cells"]
              if c["range_m"] == 600.0
              and c["rcs_m2"] == 0.10
              and c["az_deg"] == 0.0
          )
          assert math.isclose(cell["m_ant_db"], 2.0, abs_tol=1e-12)
          assert cell["projected_track_r4"] is True

          ambiguous = next(
              c for c in data["cells"]
              if c["range_m"] == 300.0
              and c["rcs_m2"] == 0.01
              and c["az_deg"] == 45.0
          )
          assert ambiguous["ambiguity_flag"] is True
          assert ambiguous["projected_track_r4"] is False

          print("RAD-LB-006 Rev.B antenna smoke PASS")
          PY

      - name: Validate D1 antenna-map evidence
        run: |
          python -m tools.antenna_map_validate             tests/fixtures/d1_antenna_map_3freq.csv             --config config/d1_map_validation_evt.json             --output antenna_map_validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("antenna_map_validation.json").read_text())
          assert data["schema"] == "ANT-D1-MAP-VALIDATION-001"
          assert data["status"] == "DATA_READY"
          assert data["row_count"] == 9
          assert len(data["groups"]) == 3
          print("D1 antenna-map validation smoke PASS")
          PY

      - name: Run D1 Monte-Carlo summary smoke
        run: |
          python -m tools.antenna_mc_summary             tests/fixtures/d1_mc_pass.csv             --output d1_mc_summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("d1_mc_summary.json").read_text())
          assert data["schema"] == "ANT-D1-MC-SUMMARY-001"
          assert data["status"] == "PASS"
          mandatory = next(
              c for c in data["cells"]
              if c["mandatory_region"]
          )
          assert mandatory["sample_count"] == 20
          assert mandatory["robust"] is True
          print("D1 Monte-Carlo summary smoke PASS")
          PY

      - name: Evaluate ANT-SIM-GATE
        run: |
          python -m tools.ant_sim_gate             --validation antenna_map_validation.json             --mc d1_mc_summary.json             --revb rad_lb_006_revb.json             --output ant_sim_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("ant_sim_gate.json").read_text())
          assert data["schema"] == "ANT-SIM-GATE-001"
          assert data["status"] == "PASS"
          assert data["mandatory_300m"]["projected_track_point_count"] >= 1
          assert data["mandatory_300m"]["projected_high_acc_point_count"] >= 1
          print("ANT-SIM-GATE smoke PASS")
          PY

      - name: Evaluate HW-SENSOR-PROTOTYPE-GATE logic
        run: |
          python -m tools.hw_sensor_prototype_gate             --m300 tests/fixtures/m300_measured_gate_pass.json             --ant-sim ant_sim_gate.json             --sys-err tests/fixtures/sys_err_gate_pass.json             --output hw_sensor_prototype_gate.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("hw_sensor_prototype_gate.json").read_text())
          assert data["schema"] == "HW-SENSOR-PROTOTYPE-GATE-001"
          assert data["status"] == "PASS"
          assert data["prototype_authorization"] == "AUTHORIZED_FOR_MEASUREMENT"
          assert "integrated radar PCB production" in data["explicitly_not_authorized"]
          print("HW-SENSOR-PROTOTYPE-GATE logic smoke PASS")
          PY

      - name: Evaluate AWR EVM profile gate
        run: |
          python -m tools.evm_profile_gate \
            --metrics tests/fixtures/evm_profile_metrics_ci.csv \
            --manifest tests/fixtures/evm_profiles/TRACK.json \
            --manifest tests/fixtures/evm_profiles/LR1.json \
            --manifest tests/fixtures/evm_profiles/LR2.json \
            --manifest tests/fixtures/evm_profiles/LRX.json \
            --config config/evm_profile_gate_evt.json \
            --output evm_profile_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("evm_profile_result.json").read_text())
          assert data["schema"] == "EVM-PROFILE-RESULT-001"
          assert data["status"] == "TEST_READY"
          assert data["profiles"]["TRACK"]["status"] == "OPERATIONAL"
          assert data["profiles"]["LR1"]["status"] == "OPERATIONAL"
          assert data["profiles"]["LR2"]["status"] == "CONDITIONAL"
          assert data["profiles"]["LRX"]["status"] == "RESEARCH_ONLY"
          print("AWR EVM profile gate smoke PASS")
          PY

      - name: Validate System Carrier design inputs
        run: |
          python -m tools.carrier_design_inputs \
            hardware/system_carrier \
            --output carrier_design_inputs.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("carrier_design_inputs.json").read_text())
          assert data["schema"] == "CARRIER-DESIGN-INPUTS-001"
          assert data["status"] == "DESIGN_INPUT_READY"
          assert data["failed_components"] == []
          assert data["bom"]["status"] == "PASS"
          assert data["pinmap"]["status"] == "PASS"
          assert data["clock_tree"]["status"] == "PASS"
          assert data["power_tree"]["status"] == "PASS"
          assert data["netlist"]["status"] == "PASS"
          print("System Carrier design-input smoke PASS")
          PY

      - name: Validate System Carrier Review A tooling
        run: |
          python -m tools.carrier_review_a \
            tests/fixtures/carrier_review_a/manifest.json \
            --repository-root . \
            --output carrier_review_a_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("carrier_review_a_result.json").read_text())
          assert data["schema"] == "CARRIER-REVIEW-A-RESULT-001"
          assert data["status"] == "TEST_READY"
          assert data["synthetic_fixture"] is True
          assert data["erc"]["errors"] == 0
          assert data["erc"]["warnings"] == 0
          assert data["pinmap"]["status"] == "PASS"
          assert data["bom"]["status"] == "PASS"
          assert all(v == "PASS" for v in data["audits"].values())
          print("Carrier Review A tooling smoke PASS")
          PY

      - name: Validate project evidence status
        run: |
          python -m tools.evidence_status             evidence/project_evidence_manifest.json             --output project_evidence_status.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("project_evidence_status.json").read_text())
          assert data["schema"] == "PROJECT-EVIDENCE-STATUS-001"
          assert data["status"] == "VALID"
          assert data["milestones"]["M1"]["status"] == "OPEN"
          assert data["milestones"]["HW_SENSOR_PROTOTYPE_GATE_INPUTS"]["status"] == "OPEN"
          assert "M300_MEASURED" in data["measured_open_items"]
          assert "SYS_ERR_MEASURED" in data["measured_open_items"]
          assert "EVIDENCE_PROMOTION_TOOLING" in data["passed_items"]
          assert "AWR_EVM_PROFILE_TOOLING" in data["passed_items"]
          assert "CARRIER_DESIGN_INPUTS" in data["passed_items"]
          assert "CARRIER_REVIEW_A_TOOLING" in data["passed_items"]
          assert "TIME_SERVICE_LOGIC" in data["passed_items"]
          assert data["milestones"]["M1"]["status"] == "OPEN"
          print("Project evidence status smoke PASS")
          PY

      - name: Validate EVM run manifest integrity
        run: |
          python -m tools.evm_run_manifest             tests/fixtures/evm_run_manifest_ci.json             --output evm_run_validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("evm_run_validation.json").read_text())
          assert data["schema"] == "EVM-RUN-VALIDATION-001"
          assert data["status"] == "TEST_READY"
          assert data["synthetic_fixture"] is True
          assert data["evidence_level"] == "SOFTWARE_CI"
          print("EVM run integrity smoke PASS")
          PY

      - name: Assemble synthetic EVM reference campaign
        run: |
          python -m tools.evm_campaign \
            --manifest tests/fixtures/evm_campaign/R050.json \
            --manifest tests/fixtures/evm_campaign/R100.json \
            --manifest tests/fixtures/evm_campaign/R150.json \
            --manifest tests/fixtures/evm_campaign/R200.json \
            --manifest tests/fixtures/evm_campaign/R250.json \
            --manifest tests/fixtures/evm_campaign/R300.json \
            --output evm_reference_campaign.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("evm_reference_campaign.json").read_text())
          assert data["schema"] == "EVM-REFERENCE-CAMPAIGN-001"
          assert data["status"] == "TEST_READY"
          assert data["measured_ranges_m"] == []
          assert data["test_ranges_m"] == [50.0, 100.0, 150.0, 200.0, 250.0, 300.0]
          print("EVM campaign assembler smoke PASS")
          PY

  stm32h753-cross:
    name: STM32H753 Cortex-M7 cross-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version
          arm-none-eabi-size --version

      - name: Configure STM32H753 link-smoke
        run: |
          cmake -S . -B build-stm32             -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-gcc.cmake             -DHIL_BUILD_HOST_TESTS=OFF             -DHIL_BUILD_STM32H753_SMOKE=ON             -DCMAKE_BUILD_TYPE=Release

      - name: Build STM32H753 ELF
        run: cmake --build build-stm32 --parallel

      - name: Inspect memory and sections
        run: |
          arm-none-eabi-size build-stm32/stm32h753_link_smoke.elf
          arm-none-eabi-objdump -h build-stm32/stm32h753_link_smoke.elf | tee build-stm32/sections.txt
          arm-none-eabi-nm -C --defined-only build-stm32/stm32h753_link_smoke.elf | tee build-stm32/symbols.txt
          test -s build-stm32/stm32h753_link_smoke.map
          grep -q "hil_runtime_process_packet" build-stm32/symbols.txt
          grep -q "targetstate_v1_serialize" build-stm32/symbols.txt
          grep -q "cv_tracker_update" build-stm32/symbols.txt
          python3 tools/check_stm32_layout.py build-stm32/sections.txt

      - name: Upload STM32H753 link evidence
        uses: actions/upload-artifact@v4
        with:
          name: stm32h753-link-evidence
          path: |
            build-stm32/stm32h753_link_smoke.elf
            build-stm32/stm32h753_link_smoke.map
            build-stm32/sections.txt
            build-stm32/symbols.txt
